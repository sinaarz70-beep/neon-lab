name: neon_lab
description: "آزمایشگاه نئون - بازی مرتب‌سازی رنگ در لوله‌های آزمایشگاه"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  games_services: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0420"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
